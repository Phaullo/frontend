
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Primeira Página</title>

    <style>
        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            color: white;
        }

        h1 {
            color: #ffeb3b;
            font-size: 40px;
            text-shadow: 2px 2px 5px #333;
        }

        p {
            font-size: 20px;
            color: #ffffff;
        }

        img {
            width: 300px;
            border-radius: 20px;
            border: 5px solid #ffeb3b;
            box-shadow: 0 5px 15px #222;
            margin: 20px;
        }

        button {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ff80ab;
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <h1>Bem-vindo ao meu site!</h1>

    <p>Esta é minha primeira página HTML.</p>

    <img src="https://via.placeholder.com/300"
         alt="Imagem de exemplo">

    <br><br>

    <button onclick="alert('Olá, mundo!')">
        Clique aqui
    </button>

</body>
</html>
